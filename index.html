<h1>shorts-watch</h1>
<p>shorts-watch は、YouTube チャンネル「ばずにゅー」の運営者が、自分のチャンネルのショート動画の数字（再生回数・視聴時間・視聴維持率・流入元など）を読んで、動画づくりを見直すために使う個人用のツールです。</p>
<ul>
<li>使う許可は「YouTube アナリティクスのレポートの表示」と「YouTube アカウントの表示」の2つで、どちらも読み取りだけです。</li>
<li>動画やチャンネルを変更・投稿・削除することはありません。</li>
<li>取得したデータは運営者のパソコンの中だけに保存し、第三者には渡しません。</li>
</ul>
